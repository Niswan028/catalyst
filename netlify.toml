# ====================================================
# CareConnect - Netlify Production Configuration
# Next.js 14 App Router + Serverless Functions
# ====================================================

[build]
  command = "npm run build"
  publish = ".next"

# Official Netlify Next.js Runtime (v5) for App Router
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_PUBLIC_SUPABASE_URL = "https://ngfzyzznryeoliodkvtd.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_LV9Pw_b8LNXC8GdN4Ukrxg_3RjZbIG7"
  NEXT_PUBLIC_APP_URL = "https://careconnectcatalyst.netlify.app"

# Security Headers & Caching Strategy
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"
